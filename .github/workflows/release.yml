name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # required for npm trusted publishing (OIDC) and provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # trusted publishing needs npm 11.5.1+ and Node 22.14+
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false  # never use caching in release builds

      - run: npm ci
      # authenticates through the trusted publisher configured on npmjs.com,
      # provenance is generated automatically
      - run: npm publish
